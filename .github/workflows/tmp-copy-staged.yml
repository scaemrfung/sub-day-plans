name: tmp-copy-staged-files
on:
  push:
    branches: [school-calendar-2026-27]
    paths: ['.github/workflows/tmp-copy-staged.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: school-calendar-2026-27
      - name: Fetch files from the pinned staging commit and check them
        run: |
          set -euo pipefail
          SRC=https://raw.githubusercontent.com/scaemrfung/pe-playbook/64ed14307ffc25709f3baea1c6ef6443461aeda2
          for f in README.md app.js autofill.js index.html lesson-catalog.js school-year.js styles.css; do
            curl -fsSL "$SRC/$f" -o "$f"
          done
          cat > /tmp/sums <<'EOF'
          939657e7e44bcbb761b36b115fb72000b0379555a021023f53ae1bc1ffe2f877  README.md
          86640144d185752583476b22a38c4ead7f0ed0386998defc964d17a0804093e1  app.js
          b3531055046c3386e328187172045a483d74e6b54a5cc486c74f8b6af742ba49  autofill.js
          8e785fc57d54d6157ae290ce855ee380d402d84c34ace3c7f37e082fd4f08357  index.html
          521283a161ba3779cbfe1bd47048974f4cf2e1941b319b89dddbacee82de158d  lesson-catalog.js
          6bd860f4cec77b43a4b0b93a91ecc772bf2fb0c760c8e27fa9614b7ceb63bac3  school-year.js
          87a4648f8bd3ff6efbcac404126def1018915ae0a89b5463258e0295bc55e8e1  styles.css
          EOF
          sed -i 's/^ *//' /tmp/sums
          sha256sum -c /tmp/sums
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app.js autofill.js index.html lesson-catalog.js school-year.js styles.css
          git commit -m "Date picker, school calendar and editable Music/Health/PE auto-fill"
          git push origin HEAD:school-calendar-2026-27
