name: Regenerate lesson catalog (one-off)
on:
  push:
    branches: [catalog-gameplan]
    paths: ['.github/workflows/regen-catalog.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gameplan
      - name: Fetch pinned lesson sources
        run: |
          set -e
          mkdir -p /tmp/src
          for p in "pe-playbook 2a836453a7e4bafbe2cb7644dc18bd6be35a65e4" "grade5health d5ed061ed69ac3cbd55ae793638f78f5147a5417" "Grade-1-Music 4c3fcf5dc5f3a6b59df091fca1de73f45c7c55d5"; do
            set -- $p
            git clone -q https://github.com/scaemrfung/$1.git /tmp/src/$1
            git -C /tmp/src/$1 checkout -q $2
          done
      - name: Build catalog
        run: |
          set -e
          echo "" | base64 -d > /tmp/mkcat_ci.js
          node /tmp/mkcat_ci.js
          echo "f0ce0bbad0a0b6d3c4455e1ab6a6a021d123fd59b79c81ac433e41c193430612  lesson-catalog.js" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "Mr. Fung"
          git config user.email "scae.mr.fung@gmail.com"
          git add lesson-catalog.js
          git commit -m "Regenerate lesson catalog: Grade 1 Music in GAMEPLAN order (Day 1 Prepare / Day 2 Practice / Day 3 Transfer)"
          git push origin HEAD:catalog-gameplan
