name: Regenerate lesson catalog (one-off)
on:
  push:
    branches: [catalog-sept-oct]
    paths: ['.github/workflows/regen-catalog.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-sept-oct
      - name: Fetch pinned lesson sources
        run: |
          set -e
          mkdir -p /tmp/src
          for p in "pe-playbook 6d17f18caf012c92cb368e6b2869f30386988502" "grade5health 4f25597fc19ea27c2513a076a76bb04644b27cb1" "Grade-1-Music e166d735e864909c31f34ae6ec7a36f8e2900408"; do
            set -- $p
            git clone -q https://github.com/scaemrfung/$1.git /tmp/src/$1
            git -C /tmp/src/$1 checkout -q $2
          done
      - name: Build catalog
        run: |
          set -e
          echo "" | base64 -d > /tmp/mkcat_ci.js
          node /tmp/mkcat_ci.js
          echo "2a22664f5f072a70bfa05f9e7c045f63bc1a8a3c999286ce8300b026a8fce297  lesson-catalog.js" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "Mr. Fung"
          git config user.email "scae.mr.fung@gmail.com"
          git add lesson-catalog.js
          git commit -m "Regenerate lesson catalog: Grade 1 Music Weeks 1-8 follow GAMEPLAN September and October"
          git push origin HEAD:catalog-sept-oct
